# 2026-11-03：iOS 原生编译工作流（真编译，不再 best-effort）
#
# 为什么需要它：
#   手机上（TrollStore 环境）**物理上不可能**跑 iOS 交叉编译——
#   Theos / iOS SDK / clang 的 Mach-O 后端都只存在于 macOS。
#   用户在 App 里说「编译一个 dylib/deb」，唯一可行路径是：
#     App 触发本 workflow → GitHub 的 macOS runner 用完整 SDK 编译
#     → 产物上传 artifact → App 用 github.download_artifact 取回
#   这就是「完整编译链」在手机上的真实形态。
#
# 与 build-tool.yml 的区别（那个保留兼容旧调用）：
#   · 那个只 clone 外部仓库、用 make 盲跑、`|| true` 吞掉所有失败 → 永远"成功"但产物为空
#   · 本 workflow 显式编译、失败即 FAIL（红叉），并且支持：
#       1) 编译本仓库自身的源码（source_mode=self）
#       2) 编译用户给定的远端仓库（source_mode=remote）
#       3) 直接编译内联的 C/ObjC/Swift 源码（source_mode=inline，最强，AI 生成代码即可编）
#
# 用法（由 App 侧 github.trigger_build 或 GitHub 页面手动触发）：
#   name: 产物名           例 mytweak
#   kind: dylib | deb | binary
#   source_mode: self | remote | inline
#   source: remote 时的仓库 URL
#   inline_code: inline 时的源码（可为多文件，用 "// ==== FILE: a.m ====" 分隔）

name: build-ios-dylib

on:
  workflow_dispatch:
    inputs:
      name:
        description: '产物名（artifact 前缀 ios-<name>）'
        required: true
        default: mydylib
      kind:
        description: '产物类型：dylib / deb / binary'
        required: true
        default: dylib
      source_mode:
        description: '源码来源：self（本仓库）/ remote（远端 git）/ inline（内联源码）'
        required: true
        default: inline
      source:
        description: 'source_mode=remote 时的仓库 URL'
        required: false
        default: ''
      inline_code:
        description: 'source_mode=inline 时的源码。多文件用 "// ==== FILE: 文件名 ====" 分隔'
        required: false
        default: ''
      arch:
        description: '目标架构：arm64 / arm64e'
        required: true
        default: arm64
      min_ios:
        description: '最低 iOS 版本'
        required: true
        default: '15.0'

jobs:
  build:
    # 2026-11-06 **必须是 macos-latest，绝不能再钉 macos-14**。
    #   macos-14 已被 GitHub 退役，dispatch 之后 runner 分配不到，
    #   run 会在 3 秒内变成 conclusion=cancelled 且 **一个 step 都没跑**，
    #   日志一片空白——看起来像「触发了但什么都没发生」。
    #   这正是「让它做 deb 一直做不出来」的真凶：请求发出去了，机器根本没起来。
    #   build-trollmcp2.yml 一直用 macos-latest，所以它每次都能跑。
    runs-on: macos-latest
    steps:
      - name: Checkout self
        if: ${{ github.event.inputs.source_mode == 'self' }}
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout remote
        if: ${{ github.event.inputs.source_mode == 'remote' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.source }}
          path: src

      - name: Materialize inline sources
        if: ${{ github.event.inputs.source_mode == 'inline' }}
        env:
          INLINE_CODE: ${{ github.event.inputs.inline_code }}
        run: |
          mkdir -p src
          python3 - <<'PY'
          import os, re
          code = os.environ.get("INLINE_CODE", "")
          if not code.strip():
              raise SystemExit("inline_code 为空：source_mode=inline 时必须提供源码")
          # 按 "// ==== FILE: xxx ====" 切分多文件；没有分隔符则视为单文件 main.m
          parts = re.split(r'^//\s*====\s*FILE:\s*(.+?)\s*====\s*$', code, flags=re.M)
          if len(parts) == 1:
              files = {"main.m": code}
          else:
              files = {}
              # parts = ['', name1, body1, name2, body2, ...]
              for i in range(1, len(parts) - 1, 2):
                  files[parts[i].strip()] = parts[i + 1]
          for fn, body in files.items():
              # 防目录穿越
              safe = fn.replace("..", "_").lstrip("/")
              path = os.path.join("src", safe)
              os.makedirs(os.path.dirname(path) or "src", exist_ok=True)
              with open(path, "w") as f:
                  f.write(body)
              print("wrote", path, len(body), "bytes")
          PY

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos --find clang++

      - name: Detect Logos sources
        id: detect
        run: |
          # Logos 语法（%hook / %ctor / .x 文件）**普通 clang 编不了**，
          # 必须过 Theos 的预处理器。以前只有 kind=deb 才装 Theos，
          # 于是「生成 tweak → kind=dylib 编译」这条路 100% 失败，
          # 而报错是 clang 看到 "%hook" 的语法错误，模型根本猜不到缺 Theos。
          if find src -type f \( -name "*.x" -o -name "*.xm" \) | grep -q .; then
            echo "logos=true" >> "$GITHUB_OUTPUT"
            echo "发现 .x/.xm 文件 → 需要 Theos"
          elif grep -rqE '^[[:space:]]*%(hook|ctor|group|end|orig|new|property|subclass)' src 2>/dev/null; then
            echo "logos=true" >> "$GITHUB_OUTPUT"
            echo "源码含 Logos 指令 → 需要 Theos"
          else
            echo "logos=false" >> "$GITHUB_OUTPUT"
            echo "纯 C/ObjC/Swift → 直接用 clang"
          fi

      - name: Install Theos (for tweak/deb builds)
        if: ${{ github.event.inputs.kind == 'deb' || steps.detect.outputs.logos == 'true' }}
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          # 2026-11-06 **这里原来只 mkdir 了一个空的 sdks/ 就完事，是 deb 编不出来的第二个原因**：
          #   · mkdir -p "$THEOS/sdks" 之后没有任何 SDK 进去 →
          #     Theos 找不到 iPhoneOS SDK，common.mk 直接报 "Unable to locate iOS SDK"；
          #   · 也没有安装 ldid/dpkg → tweak.mk 的签名与打包阶段命令不存在。
          # build-tweak.yml 那两件事都做了，这个 workflow 漏了。
          # 现在把 Xcode 自带 SDK 软链进去（免下载几 GB），并装 ldid + dpkg。
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" "$THEOS/sdks/iPhoneOS.sdk"
          ls -l "$THEOS/sdks/"
          ls -l "$THEOS/bin/dm.pl" || true
          brew install ldid dpkg >/dev/null 2>&1 || brew install ldid
          which ldid dpkg dpkg-deb || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "THEOS_MAKE_PATH=$THEOS/makefiles" >> "$GITHUB_ENV"

      - name: Build Logos tweak into dylib (Theos)
        if: ${{ github.event.inputs.kind != 'deb' && steps.detect.outputs.logos == 'true' }}
        env:
          NAME: ${{ github.event.inputs.name }}
          ARCH: ${{ github.event.inputs.arch }}
          MINIOS: ${{ github.event.inputs.min_ios }}
        run: |
          set -euo pipefail
          export THEOS="${THEOS:-$RUNNER_TEMP/theos}"
          mkdir -p out
          cd src
          # 没有 Makefile 就就地生成一个最小 tweak 工程
          if [ ! -f Makefile ]; then
            cat > Makefile <<EOF
          TARGET := iphone:clang:latest:${MINIOS}
          ARCHS := ${ARCH}
          include \$(THEOS)/makefiles/common.mk

          TWEAK_NAME = ${NAME}
          ${NAME}_FILES = \$(wildcard *.x *.xm *.m *.mm)
          ${NAME}_FRAMEWORKS = UIKit Foundation
          include \$(THEOS_MAKE_PATH)/tweak.mk
          EOF
          fi
          # 没有 Filter plist 也补一个，否则 tweak.mk 打包阶段会挑刺
          if ! ls *.plist >/dev/null 2>&1; then
            printf '{ Filter = { Bundles = ( "com.apple.springboard" ); }; }\n' > "${NAME}.plist"
          fi
          make clean >/dev/null 2>&1 || true
          make TARGET="iphone:clang:latest:${MINIOS}" ARCHS="${ARCH}" 2>&1 | tail -80
          DYLIB=$(find .theos -type f -name "${NAME}.dylib" | head -1)
          if [ -z "$DYLIB" ]; then
            DYLIB=$(find .theos -type f -name "*.dylib" | head -1)
          fi
          if [ -z "$DYLIB" ]; then
            echo "::error::Theos 编译结束但没找到 .dylib（检查上面 make 输出）"
            find .theos -type f | head -40
            exit 1
          fi
          cp "$DYLIB" "../out/lib${NAME}.dylib"
          echo "== 产物 =="
          ls -la ../out

      - name: Build dylib / binary
        if: ${{ github.event.inputs.kind != 'deb' && steps.detect.outputs.logos != 'true' }}
        env:
          NAME: ${{ github.event.inputs.name }}
          KIND: ${{ github.event.inputs.kind }}
          ARCH: ${{ github.event.inputs.arch }}
          MINIOS: ${{ github.event.inputs.min_ios }}
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos --find clang)
          CLANGXX=$(xcrun --sdk iphoneos --find clang++)
          mkdir -p out

          SRCS=$(find src -type f \( -name "*.m" -o -name "*.mm" -o -name "*.c" -o -name "*.cpp" \) \
                 -not -path "*/.git/*" | tr '\n' ' ')
          SWIFTS=$(find src -type f -name "*.swift" -not -path "*/.git/*" | tr '\n' ' ')

          echo "== ObjC/C sources: ${SRCS:-none} =="
          echo "== Swift sources:  ${SWIFTS:-none} =="

          if [ -z "${SRCS// /}" ] && [ -z "${SWIFTS// /}" ]; then
            echo "::error::没有找到任何 .m/.mm/.c/.cpp/.swift 源文件"
            exit 1
          fi

          COMMON_FLAGS=(-arch "$ARCH" -isysroot "$SDK" -miphoneos-version-min="$MINIOS" -O2 -fobjc-arc)

          if [ -n "${SWIFTS// /}" ]; then
            # Swift：需要模块化编译，直接出 dylib（-emit-library 而不是 -emit-executable）
            swiftc -sdk "$SDK" -target "${ARCH}-apple-ios${MINIOS}" -O \
                   -emit-library -o "out/lib${NAME}.dylib" $SWIFTS
          fi

          if [ -n "${SRCS// /}" ]; then
            EXTRA=()
            if [ "$KIND" = "dylib" ]; then
              EXTRA=(-dynamiclib -install_name "@executable_path/Frameworks/lib${NAME}.dylib")
            fi
            # shellcheck disable=SC2086
            "$CLANGXX" "${COMMON_FLAGS[@]}" "${EXTRA[@]}" -o "out/${NAME}" $SRCS \
              -framework Foundation -framework UIKit
          fi

          echo "== 产物 =="
          ls -la out
          file out/* || true

      - name: Build deb via Theos
        if: ${{ github.event.inputs.kind == 'deb' }}
        env:
          NAME: ${{ github.event.inputs.name }}
          ARCH: ${{ github.event.inputs.arch }}
          MINIOS: ${{ github.event.inputs.min_ios }}
        run: |
          set -uo pipefail
          export THEOS="${THEOS:-$RUNNER_TEMP/theos}"
          # 2026-11-06 **必须显式补齐这两个变量**。
          # Theos 的 makefile 靠 THEOS_MAKE_PATH 找 tweak.mk / package.mk；
          # GITHUB_ENV 在某些情况下没传到（step 间同名变量被覆盖），
          # 缺了它就报 "No such file: .../makefiles/tweak.mk"，而且报错很短很容易被忽略。
          export THEOS_MAKE_PATH="${THEOS_MAKE_PATH:-$THEOS/makefiles}"
          export THEOS_PACKAGE_SCHEME=rootless
          echo "THEOS=$THEOS"
          echo "THEOS_MAKE_PATH=$THEOS_MAKE_PATH"
          ls -d "$THEOS/makefiles/tweak.mk" "$THEOS/makefiles/package.mk" 2>&1 | head
          cd src
          # 若没有 Theos 工程骨架，就地生成一个最简 tweak 工程
          if [ ! -f Makefile ]; then
            # 2026-11-06 **不再用 here-doc**。
            #   YAML 的 run: | 只剥掉「所有行共有的最小缩进」，脚本内部仍有层级缩进；
            #   here-doc 的结束符要求顶格，一旦夹在 if 里就无法正确书写，
            #   之前 Makefile 就是这么被写坏的（make 一解析就语法错误，11 秒内挂掉）。
            #   改成 printf 逐行追加，完全不受缩进影响。
            {
              echo "THEOS_PACKAGE_SCHEME = rootless"
              echo "TARGET := iphone:clang:latest:${MINIOS}"
              echo "ARCHS := ${ARCH}"
              echo "include \$(THEOS)/makefiles/common.mk"
              echo ""
              echo "TWEAK_NAME = ${NAME}"
              echo "${NAME}_FILES = \$(wildcard *.x *.xm *.m *.mm)"
              echo "${NAME}_FRAMEWORKS = UIKit Foundation"
              echo "include \$(THEOS_MAKE_PATH)/tweak.mk"
              echo "include \$(THEOS_MAKE_PATH)/package.mk"
            } > Makefile
          fi
          echo "===== 生成的 Makefile ====="
          cat Makefile
          if [ ! -f control ]; then
            {
              echo "Package: com.vipios.${NAME}"
              echo "Name: ${NAME}"
              echo "Version: 1.0.0"
              echo "Architecture: iphoneos-arm64"
              echo "Description: built by CI"
              echo "Maintainer: vipios"
              echo "Section: Tweaks"
              echo "Depends: mobilesubstrate"
            } > control
          fi
          # 没有 Filter plist 就补一个，tweak.mk 布局阶段需要它
          if ! ls *.plist >/dev/null 2>&1; then
            printf '{ Filter = { Bundles = ( "com.apple.springboard" ); }; }\n' > "${NAME}.plist"
          fi
          make clean >/dev/null 2>&1 || true
          # 2026-11-06 **把 make 的完整输出落到文件，再分段打印**。
          # 原来直接 `make package ... 2>&1 | tail -80`：一旦 make 在前面几十行就报错，
          # tail 只会截到末尾的无关内容，真正的 error 行被冲掉，
          # 于是「失败但看不到为什么」——这正是 deb 一直调不出来的体感来源。
          set +e
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless > /tmp/mk.log 2>&1
          MK=$?
          set -e
          echo "== make exit=$MK =="
          echo "---- 前 60 行 ----"
          head -60 /tmp/mk.log
          echo "---- error/warning 行 ----"
          grep -nE 'error|Error|ERROR|No such file|cannot|unable|not found' /tmp/mk.log | head -40 || true
          echo "---- 末 30 行 ----"
          tail -30 /tmp/mk.log
          if [ "$MK" -ne 0 ]; then
            echo "::error::Theos make package 失败（exit=$MK），上面是完整诊断"
            exit 1
          fi
          mkdir -p ../out
          DEB=$(find . -maxdepth 3 -name "*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "::error::Theos 没产出 .deb（看上面的 make 输出）"
            find . -name "*.deb" -o -name ".theos" -maxdepth 2 | head -20
            exit 1
          fi
          # 2026-11-06 **重新压成 gzip，否则装不进手机**。
          #   Theos 打出来的 deb 默认用 xz 压缩（control.tar.xz / data.tar.xz）。
          #   而 TrollAgent 内置的 deb 解包器在 iOS 上没有 xz/zstd 解码能力，
          #   遇到会直接抛 "deb contains xz, no built-in extractor on iOS"。
          #   也就是说：CI 能编出 deb，但手机上永远注入失败——
          #   这是「deb 做出来了却用不了」的最后一道坎。
          #   这里统一重打包成 gzip（dpkg-deb -Zgzip），App 侧就能直接解。
          echo "== 原始 deb 压缩格式 =="
          ar t "$DEB" 2>/dev/null | head || true
          mkdir -p ../out/deb-tmp
          dpkg-deb -R "$DEB" ../out/deb-tmp/pkg 2>/dev/null || true
          BASE=$(basename "$DEB")
          if [ -d ../out/deb-tmp/pkg/DEBIAN ]; then
            dpkg-deb -Zgzip -b ../out/deb-tmp/pkg "../out/${BASE}"
            echo "== 重打包为 gzip =="
            ar t "../out/${BASE}" | head
          else
            echo "::warning::dpkg-deb -R 解包失败，直接上传原始 deb（可能无法在 iOS 内解压）"
            cp "$DEB" ../out/
          fi
          rm -rf ../out/deb-tmp
          echo "== 产物 =="
          ls -la ../out

      - name: Verify artifact is real Mach-O / deb
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::构建结束但 out/ 为空——编译实际失败了（不再静默成功）"
            exit 1
          fi
          ok=0
          for f in "${files[@]}"; do
            sz=$(stat -f%z "$f" 2>/dev/null || echo 0)
            echo "$f  size=$sz"
            if [ "$sz" -lt 512 ]; then
              echo "::warning::$f 体积异常（$sz bytes），可能是空壳"
              continue
            fi
            if file "$f" | grep -qiE "Mach-O|Debian binary package"; then
              ok=$((ok+1))
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "::error::没有任何产物被识别为 Mach-O 或 deb"
            exit 1
          fi
          echo "OK: $ok 个有效产物"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.event.inputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 14
